version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types track the oldest supported Node.js major in engines.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
